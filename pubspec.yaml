name: debt_reminder
description: "Aplikasi catatan dan pengingat hutang, offline-first untuk Android."
publish_to: "none"
version: 1.0.5+6

environment:
  sdk: ^3.13.5

dependencies:
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  go_router: ^18.1.4
  http: ^1.6.0
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  timezone: ^0.11.2
  uuid: ^4.6.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  sqlite3: ^3.9.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  image: ^4.12.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/splash_logo.png
  fullscreen: true
  android_12:
    color: "#FFFFFF"
    image: assets/branding/splash_logo.png
    icon_background_color: "#FFFFFF"
